<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой первый сайт</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

  <!-- Normalize CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

  <!-- Стили -->
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="shortcut icon" href="image/logo.jpeg">

  <style>
    /* --- Адаптивный блок фото и подписи --- */
    .photo-robin {
      max-width: 90%;
      width: 100%;
      height: auto;
      box-sizing: border-box;
      border-radius: 10px;
      border: 2px solid rgba(202, 162, 226, 0.6);
      background-color: rgba(239, 202, 237, 0.6);
      margin-top: 10px;
      display: block;
    }

    .caption {
      max-width: 90%;
      word-wrap: break-word;
      white-space: normal;
      box-sizing: border-box;
      padding: 10px;
      text-align: center;
      border: 2px solid rgba(202, 162, 226, 0.6);
      border-radius: 10px;
      background-color: rgba(239, 202, 237, 0.6);
      color: rgb(234, 103, 201);
      margin-top: 10px;
      font-size: 14px;
    }

    /* Кнопка */
    .button {
      font-family: "helvetica neue", helvetica, sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 2px solid rgba(202, 162, 226, 0.6);
      background-color: rgba(239, 202, 237, 0.6);
      color: rgb(234, 103, 201);
      box-shadow: 1px 1px 2px rgba(202, 162, 226, 0.6);
      border-radius: 10px;
      padding: 10px 20px;
      cursor: pointer;
      margin-top: 20px;
    }

    /* Адаптив */
    @media (max-width: 480px) {
      .photo-robin {
        max-width: 95%;
        height: auto;
      }
      .caption {
        font-size: 12px;
        max-width: 95%;
        padding: 8px;
      }
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <header class="header">
    <div class="container">
      <div class="header__inner">
        <a href="./index.html">
          <img class="logo" src="image/logo.jpeg" alt="Логотип">
        </a>

        <!-- Бургер -->
        <button class="burger" aria-label="Открыть меню">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav class="menu">
          <ul class="menu__list">
            <li class="menu__list-item">
              <a class="menu__list-link" href="./robin-project.html">Robin project</a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <!-- Основной контент -->
  <div class="robin-project">
    <figure class="robin-center">
      <img id="my_image" class="photo-robin" src="" alt="Фото Робина">
      <figcaption id="figcaption" class="caption"></figcaption>
    </figure>
    <button id="my_button" class="button">Показать случайное фото</button>
  </div>

  <!-- JS -->
  <script src="scripts/main.js"></script>
</body>
</html>
